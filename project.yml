name: Breezy
options:
  bundleIdPrefix: org.taun
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  BreezyKit:
    path: Packages/BreezyKit
targets:
  Breezy:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        excludes: ["*.entitlements"]
    dependencies:
      - package: BreezyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.taun.Breezy
        PRODUCT_NAME: Breezy
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Breezy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Kept here because `xcodegen generate` rewrites the project; the same team on both platforms
        # is what lets them share the iCloud Keychain token.
        DEVELOPMENT_TEAM: 6569EWWSLR
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Breezy-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/Breezy-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/Breezy-iOS.entitlements
        ENABLE_PREVIEWS: YES
