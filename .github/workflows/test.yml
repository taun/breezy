name: Test

# Every branch and pull request. Pushes to main are tested by the TestFlight workflow before it uploads.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # A pull request that changes the app must raise the version (README › Releasing), so it can be merged as is.
  version:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags
      - run: scripts/version.sh check

  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: scripts/test.sh
      - run: scripts/build.sh ios
