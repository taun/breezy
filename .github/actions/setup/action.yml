name: Set up Breezy
description: Clones the site repo next to Breezy, where the fixture tests and CLAUDE.md expect it, and installs XcodeGen.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        git clone --quiet --depth 1 https://github.com/taun/taun.github.io.git "$GITHUB_WORKSPACE/../taun.github.io"
        brew install --quiet xcodegen
        xcodebuild -version
